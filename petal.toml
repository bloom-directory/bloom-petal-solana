schema = "bloom.petal.package.v1"
name = "solana-driver"

[source]
kind = "github"
repository = "bloom-directory/bloom-petal-solana"

[build]
command = "scripts/build.sh"
outputs = ["petal/solana-driver"]

[consent]
summary = "Solana native SOL transfer driver: constructs legacy single-signer System Program transfers via mediated chain reads; never signs or broadcasts itself."

[caps]
allowed = ["bloom:chain", "bloom:store"]

[store]
namespaces = ["solana-driver"]
