schema = "bloom.petal.build.v1"
name = "solana-driver"

# The driver crate is a standalone wit-bindgen component at the repo root
# (not a nested `route/` crate); build.sh compiles it for
# wasm32-unknown-unknown and wraps each route as a component.
routes = "petal/solana-driver"
output = "petal/solana-driver"

[route_crate]
package = "bloom-solana-driver-petal"
path = "."
alias = "solana_driver"

[sdk]
package = "bloom-petal-sdk"
git = "https://github.com/bloom-directory/petal"
rev = "61938d0c127cfe03c7e3e55baed0ba1439bc5ca2"

[dependencies]
serde = "1"
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
wit-bindgen = "0.51"
solana-message = { version = "4.5.0", default-features = false, features = ["wincode"] }
solana-system-interface = { version = "3.3.0", default-features = false, features = ["bincode"] }
